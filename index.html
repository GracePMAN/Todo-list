<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A simple, clean todo list. Your tasks are saved in your browser." />
    <meta name="color-scheme" content="light dark" />
    <title>Todo List</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%93%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">Todo List</h1>
        <p class="app__subtitle">Add a task, tick it off, and pick it up later. Everything stays in this browser.</p>
      </header>

      <section class="card" aria-label="Your tasks">
        <form class="todo-form" id="todo-form" novalidate>
          <label class="visually-hidden" for="todo-input">New task</label>
          <input
            class="todo-form__input"
            id="todo-input"
            name="todo"
            type="text"
            placeholder="What needs to be done?"
            maxlength="200"
            autocomplete="off"
            enterkeyhint="done"
          />
          <button class="btn btn--primary" type="submit">Add task</button>
        </form>

        <div class="toolbar">
          <div class="filters" id="todo-filters" role="group" aria-label="Filter tasks">
            <button class="filter is-active" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter" type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
          <button class="btn btn--ghost" type="button" id="clear-completed">Clear completed</button>
        </div>

        <ul class="todo-list" id="todo-list"></ul>

        <p class="empty-state" id="empty-state" hidden>
          <span class="empty-state__icon" aria-hidden="true">✅</span>
          <strong class="empty-state__title" id="empty-title"></strong>
          <span class="empty-state__text" id="empty-text"></span>
        </p>

        <footer class="app__footer">
          <span id="items-left">0 of 0 items left</span>
          <span class="app__saved" id="save-status" role="status" aria-live="polite">Saved locally</span>
        </footer>
      </section>

      <p class="app__note">
        Tasks are stored in <code>localStorage</code> on this device only &mdash; no account, no server.
      </p>
    </main>

    <template id="todo-item-template">
      <li class="todo-item">
        <label class="todo-item__label">
          <input class="todo-item__checkbox" type="checkbox" />
          <span class="todo-item__title"></span>
        </label>
        <button class="icon-btn icon-btn--edit" type="button" title="Edit task">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path
              d="M4 20h4l10-10-4-4L4 16v4Zm12.7-12.3 1.3-1.3a1 1 0 0 1 1.4 0l1.2 1.2a1 1 0 0 1 0 1.4l-1.3 1.3-2.6-2.6Z"
              fill="currentColor"
            />
          </svg>
        </button>
        <button class="icon-btn icon-btn--danger" type="button" title="Delete task">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path
              d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 9Z"
              fill="currentColor"
            />
          </svg>
        </button>
      </li>
    </template>

    <script src="js/app.js"></script>
  </body>
</html>
